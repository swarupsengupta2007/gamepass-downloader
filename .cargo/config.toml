# See https://docs.rs/aes/0.9.1/aes/#supported-backends
# and https://github.com/xodus-gaming/xodus/pull/60

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-feature=+aes,+ssse3"]

# One self-contained exe on Windows: the C runtime is linked in, so it needs
# no Visual C++ redistributable. The AES flags are repeated so they hold
# whichever way Cargo combines the two matching tables.
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+aes,+ssse3,+crt-static"]

[env]
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = ".cargo/msvc-static-crt.cmake", relative = true }

[target.'cfg(target_arch = "aarch64")']
rustflags = ["-Ctarget-feature=+aes"]
