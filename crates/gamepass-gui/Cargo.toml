[package]
name = "gamepass-gui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Download a paused Xbox app install and hand it back to the Xbox app; carries the xodus-cli commands"

[[bin]]
name = "gamepass-downloader"
path = "src/main.rs"

[dependencies]
xodus-cli = { path = "../xodus-cli" }
xodus = { path = "../xodus" }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
eframe = "0.31"
serde_json = "1.0.151"
fs2 = "0.4.3"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
